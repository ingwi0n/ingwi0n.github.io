<style>
/* Layout: atlas sheet. Map takes the page; a right-hand rail holds the reading instruments. Stacks on phones. */
:root {
  --bg: #ffffff;
  --panel: #ffffff;
  --ink: #141815;
  --ink-2: #4a524d;
  --muted: #7a827d;
  --line: #e2e5e2;
  --line-2: #c6ccc7;
  --accent: #1f4d3a;
  --map-bg: #ffffff;
  --nodata: #e4e7e4;
  --county: #ffffff;
  --R-text: #c50003; --D-text: #0036c0;
  --R: #ff2326; --D: #2a6dff; --I: #efb300; --O: #7d848c; --F: var(--D);

  --f-body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {

    --bg: #111412; --panel: #171b18; --ink: #edf1ed; --ink-2: #b3bcb5; --muted: #858e88;
    --line: #272d29; --line-2: #3a423d; --accent: #8fc9a8; --map-bg: #111412; --nodata: #222824;
    --R: #ff2326; --D: #2a6dff; --I: #efb300; --O: #7d848c; --F: var(--D);
    --dec: #b47ccb; --inc: #4fb174; --mid: #2a302c; --R-text: #ff5a52; --D-text: #6fa2ff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111412; --panel: #171b18; --ink: #edf1ed; --ink-2: #b3bcb5; --muted: #858e88;
  --line: #272d29; --line-2: #3a423d; --accent: #8fc9a8; --map-bg: #111412; --nodata: #222824;
  --R: #ff2326; --D: #2a6dff; --I: #efb300; --O: #7d848c; --F: var(--D);
  --dec: #b47ccb; --inc: #4fb174; --mid: #2a302c; --R-text: #ff5a52; --D-text: #6fa2ff;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font: 14px/1.45 var(--f-body);
  padding-inline: 16px; padding-block: 12px;
  box-sizing: border-box;
  display: flex; flex-direction: column; gap: 12px;
  -webkit-font-smoothing: antialiased;
}
*, *::before, *::after { box-sizing: inherit; }
button, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- header ---------- */
.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 10px 24px; }
.ident { min-width: 0; display: grid; gap: 2px; }
.eyebrow { margin: 0; font: 600 11px/1.3 var(--f-display); font-stretch: 90%; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 0; font: 800 30px/1.02 var(--f-display); font-stretch: 72%; letter-spacing: -.005em; text-wrap: balance; }
h1 .yr { color: var(--muted); font-weight: 600; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; }
.seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 5px; cursor: pointer; font-weight: 600; font-size: 13px; color: var(--ink-2); }
.seg button:hover { color: var(--ink); background: color-mix(in oklab, var(--line) 50%, transparent); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }

/* ---------- app ---------- */
.app { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 12px; }
.mapwrap { position: relative; min-height: 0; border: 1px solid var(--line); border-radius: var(--r); background: var(--map-bg); overflow: hidden; }
.mapbox { position: absolute; inset: 0; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
#map:active { cursor: grabbing; }
#map path.p { stroke: var(--map-bg); stroke-width: .22; vector-effect: non-scaling-stroke; transition: opacity .15s; }
#map path.cty { stroke: var(--county); stroke-width: 1.6; vector-effect: non-scaling-stroke; }
#map .cmesh { fill: none; stroke: var(--county); stroke-width: 1.6; vector-effect: non-scaling-stroke; pointer-events: none; }
#map .outline { fill: none; stroke: var(--ink); stroke-width: 1.2; vector-effect: non-scaling-stroke; pointer-events: none; }
#map .hov { fill: none; stroke: var(--ink); stroke-width: 1.4; vector-effect: non-scaling-stroke; pointer-events: none; }
#map .pin { fill: none; stroke: var(--ink); stroke-width: 2.6; vector-effect: non-scaling-stroke; pointer-events: none; }
#map .pin-halo { fill: none; stroke: var(--map-bg); stroke-width: 5; vector-effect: non-scaling-stroke; pointer-events: none; }
#map g.dim path.p:not(.hi) { opacity: .16; }
#map text.lbl { font: 700 10.5px var(--f-display); font-stretch: 80%; letter-spacing: .1em; text-transform: uppercase; fill: var(--ink); stroke: var(--map-bg); stroke-width: 3px; paint-order: stroke; stroke-linejoin: round; pointer-events: none; text-anchor: middle; }

.zoombox { position: absolute; top: 10px; right: 10px; display: flex; flex-direction: column; gap: 6px; align-items: end; }
.zoombox .grp { display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.zoombox .grp.row { flex-direction: row; }
.zoombox button { border: 0; background: none; min-width: 32px; height: 30px; padding: 0 9px; cursor: pointer; font-weight: 600; font-size: 12px; color: var(--ink-2); }
.zoombox button + button { border-top: 1px solid var(--line); }
.zoombox .row button + button { border-top: 0; border-left: 1px solid var(--line); }
.zoombox button:hover { color: var(--ink); background: color-mix(in oklab, var(--line) 45%, transparent); }

.legend { position: absolute; left: 10px; bottom: 10px; max-width: calc(100% - 20px); background: color-mix(in oklab, var(--panel) 92%, transparent); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px 9px; display: grid; gap: 6px; font-size: 11px; color: var(--ink-2); backdrop-filter: blur(4px); }
.legend .lt { font: 700 10.5px var(--f-display); font-stretch: 85%; letter-spacing: .07em; text-transform: uppercase; color: var(--ink); }
.lg-grid { display: grid; grid-template-columns: auto repeat(10, 16px); gap: 2px 1px; align-items: center; }
.lg-grid .nm { padding-right: 8px; white-space: nowrap; }
.lg-grid .sw { height: 12px; border-radius: 2px; }
.lg-grid .ax { font-size: 10px; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }
.lg-ramp { display: grid; gap: 3px; justify-self: start; }
.lg-ramp .sws { display: grid; grid-auto-flow: column; grid-auto-columns: var(--sw, 20px); gap: var(--gap, 1px); }
.lg-ramp .sws span { height: 12px; border-radius: 2px; }
.edges { position: relative; height: 13px; font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }
.edges span { position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap; }
.lg-ramp .gbar { height: 12px; border-radius: 2px; max-width: 100%; }
.lg-ramp .dir { display: flex; justify-content: space-between; font-size: 10px; color: var(--ink-2); }
.lg-nd { display: flex; align-items: center; gap: 6px; color: var(--muted); }
.lg-nd i { width: 12px; height: 12px; border-radius: 2px; background: var(--nodata); display: inline-block; }

/* ---------- panel ---------- */
.panel { min-height: 0; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 16px 20px; display: flex; flex-direction: column; gap: 18px; overscroll-behavior: contain; }
#view { display: grid; gap: 22px; min-width: 0; }
#sel:empty { display: none; }
.panel section { display: grid; gap: 10px; min-width: 0; }
h2 { margin: 0; font: 800 19px/1.15 var(--f-display); font-stretch: 78%; text-wrap: balance; }
h3 { margin: 0; font: 700 11px/1.3 var(--f-display); font-stretch: 88%; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.sub { margin: -4px 0 0; color: var(--muted); font-size: 12px; }
.num { font-variant-numeric: tabular-nums; }

.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.kpi { background: var(--panel); padding: 8px 10px; display: grid; gap: 1px; min-width: 0; }
.kpi b { font: 700 19px/1.15 var(--f-display); font-stretch: 85%; font-variant-numeric: tabular-nums; }
.kpi span { font-size: 11px; color: var(--muted); }
.up { color: var(--inc); } .down { color: var(--dec); }
i.pR, i.pD { font-style: normal; } .pR { color: var(--R-text); } .pD { color: var(--D-text); }

/* candidate rows */
.clist { display: grid; }
.chead, .crow { display: grid; grid-template-columns: 10px minmax(0, 1fr) 52px 92px; gap: 0 10px; align-items: center; }
.chead { font-size: 10px; color: var(--muted); padding: 0 6px 4px; border-bottom: 1px solid var(--line); }
.chead .sp { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }
.crow { width: 100%; text-align: left; border: 0; background: none; padding: 6px 6px; border-radius: 5px; cursor: pointer; }
.crow:hover { background: color-mix(in oklab, var(--line) 45%, transparent); }
.crow.static { cursor: default; } .crow.static:hover { background: none; }
.chip { width: 10px; height: 10px; border-radius: 2px; background: var(--c); }
.cname { min-width: 0; display: grid; line-height: 1.25; }
.cname b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cname small { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.cpct { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.spread { width: 92px; height: 16px; display: block; overflow: visible; }
.cut { display: flex; align-items: center; gap: 8px; margin: 4px 6px; font: 600 10px var(--f-display); font-stretch: 88%; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.cut::before, .cut::after { content: ""; height: 1px; flex: 1; background: var(--line-2); }

/* selection card */
.card { border: 1px solid var(--line-2); border-radius: 6px; padding: 12px; display: grid; gap: 10px; background: var(--bg); }
.card-h { display: flex; justify-content: space-between; align-items: start; gap: 8px; }
.card-h h2 { font-size: 18px; }
.card-h p { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
.x { border: 1px solid var(--line); background: var(--panel); border-radius: 5px; width: 26px; height: 26px; cursor: pointer; color: var(--ink-2); flex: none; line-height: 1; }
.rlist { display: grid; gap: 4px; }
.rrow { display: grid; grid-template-columns: minmax(0, 1fr) 70px 44px 44px; gap: 8px; align-items: center; font-size: 12.5px; }
.rrow .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rrow .bar { height: 8px; background: color-mix(in oklab, var(--line) 70%, transparent); border-radius: 2px; overflow: hidden; }
.rrow .bar i { display: block; height: 100%; background: var(--c); border-radius: 0 2px 2px 0; }
.rrow .v { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
.rrow .p { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.foot { font-size: 11px; color: var(--muted); }

/* form */
.field { display: grid; gap: 4px; }
.field label { font-size: 11px; color: var(--muted); }
select { appearance: none; width: 100%; padding: 8px 32px 8px 10px; border: 1px solid var(--line-2); border-radius: 6px; background: var(--panel) no-repeat right 10px center / 10px 6px; background-image: linear-gradient(45deg, transparent 50%, var(--ink-2) 50%), linear-gradient(-45deg, transparent 50%, var(--ink-2) 50%); background-size: 5px 5px, 5px 5px; background-position: right 15px center, right 10px center; font-weight: 600; cursor: pointer; }

/* tables */
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
th { text-align: right; font-weight: 600; font-size: 11px; color: var(--muted); padding: 4px 6px; border-bottom: 1px solid var(--line-2); white-space: nowrap; }
td { text-align: right; padding: 5px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; padding-left: 0; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: color-mix(in oklab, var(--line) 40%, transparent); }
td .mini { display: inline-block; vertical-align: middle; height: 7px; background: var(--c); border-radius: 0 2px 2px 0; margin-right: 6px; }

tr.on td { background: color-mix(in oklab, var(--ink) 8%, transparent); font-weight: 600; }
tr.on td:first-child { box-shadow: inset 3px 0 0 var(--ink); padding-left: 8px; }
td .when { display: block; font-size: 10.5px; color: var(--muted); font-weight: 400; }
td.lft { text-align: left; white-space: normal; }
.ctl-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; }
.ctl-row .field { flex: 1 1 160px; }
.stat { margin: 0; font-size: 12.5px; color: var(--ink-2); }
.stat b { color: var(--ink); font-variant-numeric: tabular-nums; }
#scatter svg { display: block; width: 100%; overflow: visible; }
#scatter text { font: 10px var(--f-body); fill: var(--muted); font-variant-numeric: tabular-nums; }
#scatter .ttl { fill: var(--ink-2); font-weight: 600; }
#scatter .grid { stroke: var(--line); }
#scatter .zero { stroke: var(--ink-2); stroke-dasharray: 2 3; }
#scatter .fit { stroke: var(--ink); stroke-width: 1.6; fill: none; }
#scatter .dot { fill-opacity: .5; stroke: var(--panel); stroke-width: .6; }
#scatter .ring { fill: none; stroke: var(--ink); stroke-width: 1.8; pointer-events: none; }
.hist { width: 100%; }
.hist svg { display: block; width: 100%; overflow: visible; }
.hist text { font: 10px var(--f-body); fill: var(--muted); font-variant-numeric: tabular-nums; }
.hist .grid { stroke: var(--line); }
.hist .base { stroke: var(--line-2); }
.hist .ref { stroke: var(--ink); stroke-dasharray: 3 3; }
.hist .reflbl { fill: var(--ink); font-weight: 600; }
.hist .bin { cursor: crosshair; }
.hist .bin:hover path { filter: brightness(.88); }

.notes { font-size: 11.5px; color: var(--muted); display: grid; gap: 6px; border-top: 1px solid var(--line); padding-top: 14px; }
.notes p { margin: 0; }
.notes b { color: var(--ink-2); font-weight: 600; }

#tip { position: fixed; z-index: 10; pointer-events: none; background: var(--ink); color: var(--panel); border-radius: 6px; padding: 7px 9px; font-size: 12px; line-height: 1.35; max-width: 240px; box-shadow: 0 4px 16px rgb(0 0 0 / .18); }
#tip b { font-weight: 700; }
#tip .t2 { opacity: .75; font-size: 11px; }

@media (max-width: 899px) {
  html, body { height: auto; }
  .app { display: flex; flex-direction: column; }
  .mapwrap { display: flex; flex-direction: column; }
  .mapbox { position: relative; inset: auto; height: 58vh; min-height: 340px; }
  .legend { position: static; margin: 0 10px 10px; max-width: none; justify-self: start; align-self: start; }
  .panel { overflow: visible; }
  h1 { font-size: 26px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

    <div class="kpis">
      <div class="kpi"><b>${fN(Math.round(tg === 'all' ? DIST.b : db))}</b><span>${tg === 'all' ? 'Ballots, 2026' : TG[tg] + ', 2026 est.'}</span></div>
      <div class="kpi"><b class="${v > 0 ? 'up' : 'down'}">${sgn(v)}</b><span>${tg === 'all' ? 'Turnout' : TG[tg]} vs ${yr} primary</span></div>
      <div class="kpi"><b>${fN(P.filter(p => { const x = tChg(p); return x != null && x < 0; }).length)}</b><span>Precincts down</span></div>
    </div>
    <p class="sub" style="margin:0">${sideNote}</p>
  </section>
  <section>
    <h3>${tg === 'all' ? 'Turnout' : TG[tg] + ' turnout'} change by precinct</h3>
    <p class="sub">Precincts with ${MINBASE}+ ballots in ${yr}. Values beyond ±50% sit in the end bars. Hover a bar to find its precincts.</p>
    <div class="hist" id="hist"></div>
  </section>
  <section><h3>By county</h3>${countyTable(cols)}</section>`;
}

// ---------- histogram ----------
function histogram(el, items, { val, lo, hi, w, color, ref, refLabel, label }) {
  const width = Math.max(240, el.clientWidth), height = 150, m = { t: 18, r: 6, b: 22, l: 26 };
  const vals = items.map(it => ({ it, x: Math.max(lo, Math.min(hi - 1e-9, val(it))) }));
  const th = d3.range(lo, hi + 1e-9, w).map(x => +x.toFixed(6));
  const bins = d3.bin().value(d => d.x).domain([lo, hi]).thresholds(th)(vals);
  const x = d3.scaleLinear().domain([lo, hi]).range([m.l, width - m.r]);
  const y = d3.scaleLinear().domain([0, d3.max(bins, b => b.length) || 1]).nice(3).range([height - m.b, m.t]);
  const s = d3.select(el).html('').append('svg').attr('viewBox', `0 0 ${width} ${height}`).attr('height', height);
  s.append('g').selectAll('line').data(y.ticks(3).slice(1)).join('line').attr('class', 'grid').attr('x1', m.l).attr('x2', width - m.r).attr('y1', y).attr('y2', y);
  s.append('g').selectAll('text').data(y.ticks(3).slice(1)).join('text').attr('x', m.l - 5).attr('y', d => y(d) + 3).attr('text-anchor', 'end').text(d => d);
  const g = s.append('g').selectAll('g').data(bins).join('g').attr('class', 'bin');
  g.append('rect').attr('x', b => x(b.x0)).attr('width', b => x(b.x1) - x(b.x0)).attr('y', m.t).attr('height', height - m.b - m.t).attr('fill', 'transparent');
  g.append('path').attr('fill', b => color((b.x0 + b.x1) / 2)).attr('d', b => {
    if (!b.length) return null;
    const x0 = x(b.x0) + 1, x1 = x(b.x1) - 1, y0 = y(0), y1 = y(b.length), r = Math.min(2, (x1 - x0) / 2, y0 - y1);
    return `M${x0},${y0}V${y1 + r}Q${x0},${y1} ${x0 + r},${y1}H${x1 - r}Q${x1},${y1} ${x1},${y1 + r}V${y0}Z`;
  });
  g.on('pointermove', (e, b) => {
    if (!b.length) return;
    showTip(e, `<b>${b.length} precinct${b.length > 1 ? 's' : ''}</b><div class="t2">${label(b.x0, b.x1)}</div>`);
    if (S.level === 'prec') { const set = new Set(b.map(d => d.it.i)); precPaths.classed('hi', function () { return set.has(this.__u.i); }); gPrec.classed('dim', true); }
  }).on('pointerleave', () => { hideTip(); gPrec.classed('dim', false); precPaths.classed('hi', false); });
  s.append('line').attr('class', 'base').attr('x1', m.l).attr('x2', width - m.r).attr('y1', y(0)).attr('y2', y(0));
  const xt = x.ticks(Math.min(6, Math.floor(width / 60)));
  s.append('g').selectAll('text').data(xt).join('text').attr('x', x).attr('y', height - 6).attr('text-anchor', 'middle').text(d => label.tick(d));
  if (ref != null) {
    const rx = x(Math.max(lo, Math.min(hi, ref)));
    s.append('line').attr('class', 'ref').attr('x1', rx).attr('x2', rx).attr('y1', m.t - 4).attr('y2', y(0));
    s.append('text').attr('class', 'reflbl').attr('x', rx).attr('y', m.t - 7).attr('text-anchor', rx > width * .75 ? 'end' : rx < width * .25 ? 'start' : 'middle').text(refLabel);
  }
}
function drawHist() {
  const el = document.getElementById('hist'); if (!el) return;
  if (S.mode === 'cand' && !isField()) {
    const cd = CD(S.cand), bw = cd.st / 2, mx = d3.max(solid, p => cd.sh(p));
    const hi = Math.min(1, Math.ceil((mx + 1e-9) / bw) * bw), k = cd.hue;
    const lbl = (a, b) => `${pct(a, bw < .01 ? 1 : 0)} – ${pct(b, bw < .01 ? 1 : 0)} share`;
    lbl.tick = d => (d * 100).toFixed(bw < .01 ? 1 : 0) + '%';
    histogram(el, solid, { val: p => cd.sh(p), lo: 0, hi, w: bw, color: v => shareCol(k, v),
      ref: cd.votes / DIST.tv, refLabel: 'District ' + pct(cd.votes / DIST.tv), label: lbl });
  } else if (isField() && fview() === 'share') {
    const lbl = (a, b) => `${pct(a, 0)} – ${pct(b, 0)} non-Baumgartner`;
    lbl.tick = d => (d * 100).toFixed(0) + '%';
    histogram(el, solid, { val: p => p.fsh, lo: 0, hi: 1, w: .05, color: v => shareCol('D', v),
      ref: DIST.fsh, refLabel: 'District ' + pct(DIST.fsh), label: lbl });
  } else if (isField()) {
    const pts = (v, d = 1) => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v * 100).toFixed(d);
    const lbl = (a, b) => `${last(C[1].name)} ${pts(a, 1)} to ${pts(b, 1)} pts vs ${last(C[2].name)}`;
    lbl.tick = d => pts(d, 0);
    const m = DIST.sh[1] - DIST.sh[2];
    histogram(el, solid, { val: p => p.sh[1] - p.sh[2], lo: -.3, hi: .3, w: .025, color: v => (v >= 0 ? shade('D', .7) : shade('I', .7)),
      ref: m, refLabel: `District: ${last(C[1].name)} +${(m * 100).toFixed(1)}`, label: lbl });
  } else if (S.mode === 'turnout') {
    const items = P.filter(p => tChg(p) != null);
    const lbl = (a, b) => `${sgn(a, 0)} to ${sgn(b, 0)} turnout change`;
    lbl.tick = d => d === 0 ? '0' : sgn(d, 0);
    histogram(el, items, { val: p => tChg(p), lo: -.5, hi: .5, w: .05, color: v => divCol(v, 'P', 'G', TRN),
      ref: tChg(DIST), refLabel: 'District ' + sgn(tChg(DIST)), label: lbl });
  }
}

// ---------- selection card ----------
function renderSel() {
  const u = S.pin;
  if (!u) { selEl.innerHTML = ''; return; }
  const e = S.mode === 'results' ? Math.max(0, S.el) : 0, el = E[e], st = eStats(u, e);
  const top = st.order.filter(j => st.v[j] > 0).slice(0, 6), rest = st.order.filter(j => st.v[j] > 0).slice(6);
  const restV = sum(rest.map(j => st.v[j]));
  const row = (n, v, s, c) => `<div class="rrow"><span class="nm">${n}</span><span class="bar"><i style="--c:${c};width:${(s * 100).toFixed(1)}%"></i></span><span class="v">${fN(Math.round(v))}</span><span class="p">${pct(s)}</span></div>`;
  const c24 = chg(u.t26, u.t24), c22 = chg(u.t26, u.t22);
  selEl.innerHTML = `<div class="card" aria-live="polite">
    <div class="card-h"><div><h2>${uName(u)}</h2><p>${uSub(u)}</p></div><button class="x" id="unpin" aria-label="Clear selection">×</button></div>
    <div class="kpis">
      <div class="kpi"><b>${fN(u.b)}</b><span>Ballots</span></div>
      <div class="kpi"><b class="${c24 > 0 ? 'up' : 'down'}">${sgn(c24)}</b><span>vs 2024</span></div>
      <div class="kpi"><b class="${c22 > 0 ? 'up' : 'down'}">${sgn(c22)}</b><span>vs 2022</span></div>
    </div>
    ${st.tv ? `${e ? `<h3>${el.label}, ${el.when} · ${tpLbl(twoParty(u, e).m)} two-party</h3>` : ''}<div class="rlist">${top.map(j => row(el.cands[j].name, st.v[j], st.sh[j], `var(--${el.hue[j]})`)).join('')}${rest.length ? row(`${rest.length} others`, restV, restV / st.tv, 'var(--O)') : ''}</div>
    <div class="foot">${e ? `${fN(Math.round(st.tv))} votes, on 2026 precinct lines` : `${fN(u.tv)} votes · ${fN(u.u)} skipped this race · ${fN(u.o)} overvoted`}</div>
    ${(S.mode === 'swing' || (S.mode === 'results' && S.el < 0)) && u.tv ? `<div class="foot">${marginTxt(u.m26)}${S.mode === 'swing' && S.bl >= 0 ? ` · swing from ${BLM[S.bl].label} ${ptsS(swingOf(u, S.bl, false))}` : ''}</div>` : ''}
    ${isField() && u.fv ? `<div class="foot">Non-Baumgartner ${pct(u.fsh)} · ${last(C[u.fl].name)} tops all others with ${pct(u.flsh)}</div>` : ''}` : `<div class="foot">No votes cast in this ${u.kind === 'county' ? 'county' : 'precinct'}.</div>`}
  </div>`;
  document.getElementById('unpin').onclick = () => setPin(null);
}

// ---------- render ----------
function render() {
  document.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === S.mode));
  document.querySelectorAll('[data-level]').forEach(b => b.setAttribute('aria-pressed', b.dataset.level === S.level));
  gPrec.attr('hidden', S.level === 'prec' ? null : true);
  gCty.attr('hidden', S.level === 'county' ? null : true);
  if (S.level === 'prec') precPaths.style('fill', function () { return fill(this.__u); });
  else ctyPaths.style('fill', function () { return fill(this.__u); });
  placeLabels();
  renderLegend();
  viewEl.innerHTML = S.mode === 'results' ? resultsView() : S.mode === 'cand' ? candView() : S.mode === 'swing' ? swingView() : turnoutView();
  drawHist(); drawScatter();
  viewEl.querySelectorAll('button.crow').forEach(b => b.onclick = () => { S.cand = +b.dataset.j; S.mode = 'cand'; render(); });
  const cs = document.getElementById('candSel'); if (cs) cs.onchange = () => { S.cand = /^\d+$/.test(cs.value) ? +cs.value : cs.value; render(); };
  const es = document.getElementById('elSel'); if (es) es.onchange = () => { S.el = +es.value; render(); };
  viewEl.querySelectorAll('[data-base]').forEach(b => b.onclick = () => { S.base = b.dataset.base; render(); });
  viewEl.querySelectorAll('[data-tg]').forEach(b => b.onclick = () => { S.tg = b.dataset.tg; render(); });
  viewEl.querySelectorAll('tr[data-bl]').forEach(tr => tr.onclick = () => { const i = +tr.dataset.bl; S.bl = S.bl === i ? -1 : i; render(); });
  viewEl.querySelectorAll('[data-rel]').forEach(b => b.onclick = () => { S.rel = b.dataset.rel === '1'; render(); });
  viewEl.querySelectorAll('[data-sy]').forEach(b => b.onclick = () => { S.sy = b.dataset.sy; render(); });
  const sc = document.getElementById('scSel'); if (sc) sc.onchange = () => { S.scand = /^\d+$/.test(sc.value) ? +sc.value : sc.value; render(); };
  viewEl.querySelectorAll('tr[data-c]').forEach(tr => tr.onclick = () => {
    const u = CO[+tr.dataset.c]; setPin(u); zoomTo(path.bounds(cFeats[u.i]));
  });
  renderSel();
  try { localStorage.setItem('wa5-view', JSON.stringify({ mode: S.mode, level: S.level, el: S.el, cand: S.cand, base: S.base, tg: S.tg, bl: S.bl, rel: S.rel, scand: S.scand, sy: S.sy })); } catch (e) {}
}
document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { S.mode = b.dataset.mode; render(); });

document.querySelectorAll('[data-level]').forEach(b => b.onclick = () => {
  S.level = b.dataset.level;
  if (S.pin && S.pin.kind !== (S.level === 'prec' ? 'prec' : 'county')) setPin(null);
  render();
});
new ResizeObserver(() => { drawHist(); drawScatter(); }).observe(document.getElementById('panel'));

// notes
document.getElementById('notes').innerHTML = `
  <p><b>Sources.</b> Washington Secretary of State precinct results (2026 primary; 2024 and 2022 primaries and generals) and statewide precinct maps; 2020 Census blocks.</p>
  <p><b>Ballots.</b> 2026 ballots are CD-5 votes plus undervotes and overvotes. Walla Walla County reports no ballots-cast figure, so this rebuilds it.</p>
  <p><b>Turnout change.</b> The 2022 and 2024 files lack ballots cast, so every year uses the same stand-in: the largest single-race vote total in each precinct. It runs about 1% under true ballots, alike in every year.</p>
  <p><b>Precinct changes.</b> Older results are moved onto 2026 precinct lines. ${D.xw['2022'].split} precincts changed since 2022 and ${D.xw['2024'].split} since 2024; their ballots are split by 2020 census population. Spokane precincts 6065 and 7303 postdate the 2026 precinct map and are folded into 6016 and 7301, the precincts they were split from.</p>
  <p><b>Party turnout</b> estimates multiply each precinct's ballots by each side's two-party share in the CD-5 primary. Independents count with Democrats in 2026, and write-ins are left out.</p>
  <p><b>All others</b> means every candidate other than Baumgartner, write-ins included.</p>
  <p><b>Swing.</b> Every margin is the Republican-preference share minus everyone else's (minor parties and write-ins count as non-Republican). Primary baselines combine all Republican-preference candidates, including Leon Lawson ("Trump Republican") and Dave Saulibio ("JFK Republican") in the 2022 Senate race. Precincts need ${MINV}+ votes in both races. Correlations are weighted by 2026 votes.</p>
  <p><b>Older races.</b> A few small precincts show no votes in past primaries; their ballots were reported with neighboring precincts, and district totals are complete.</p>
  <p><b>Franklin County</b> shows only its CD-5 portion.</p>`;

try {
  const s = JSON.parse(localStorage.getItem('wa5-view') || 'null');
  if (s) {
    if (s.mode === 'field') { s.mode = 'cand'; s.cand = s.fview === 'lead' ? 'fl' : 'fs'; }
    delete s.fview; Object.assign(S, s);
    if (!(S.el >= -1 && S.el < E.length)) S.el = 0;
  }
} catch (e) {}
render();
})();
</script>
